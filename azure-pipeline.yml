
trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  python.version: '3.10'

steps:
- checkout: self

- task: UsePythonVersion@0
  displayName: 'Use Python $(python.version)'
  inputs:
    versionSpec: '$(python.version)'
    addToPath: true

- script: |
    python --version
    python -m pip install --upgrade pip
    python -m pip install -r requirements.txt
  displayName: 'Install dependencies'

- script: |
    python -m pip install pytest pytest-azurepipelines
    python -m pytest
  displayName: 'Run tests'

# Package the repository contents without adding a parent folder.
- task: ArchiveFiles@2
  displayName: 'Package Flask application'
  inputs:
    rootFolderOrFile: '$(Build.SourcesDirectory)'
    includeRootFolder: false
    archiveType: zip
    archiveFile: '$(Build.ArtifactStagingDirectory)/flask-app.zip'
    replaceExistingArchive: true

# Verify the files that will be deployed.
- bash: |
    set -e
    ZIP="$(Build.ArtifactStagingDirectory)/flask-app.zip"

    echo "Checking deployment package..."
    unzip -l "$ZIP"

    unzip -Z1 "$ZIP" | grep -qx 'requirements.txt'
    unzip -Z1 "$ZIP" | grep -qx 'startup.py'
    unzip -Z1 "$ZIP" | grep -qx 'hello_app/__init__.py'
  displayName: 'Validate deployment package'

- task: PublishBuildArtifacts@1
  displayName: 'Publish deployment artifact'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: drop
    publishLocation: Container
